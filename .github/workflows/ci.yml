name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked dependencies
        run: |
          python -m pip install pip==25.3
          python -m pip install -r requirements-dev.lock

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy agents api data_sources evals graph literature llm schemas tools examples production.py config.py logging_config.py main.py

      - name: Test with branch coverage
        # ``python -m`` keeps the repository root on sys.path on every runner.
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Check business capability evaluation
        run: python -m evals.release_benchmark --baseline evals/baseline.json

      - name: Audit release contents
        run: python scripts/release_audit.py

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.lock
